# SafeRTP Configuration
# World-specific settings are in worlds.yml

# Active language. ISO-639-1 two-letter code (lowercase).
# Bundled out of the box: es (Spanish), en (English).
# Missing keys fall back to en automatically. Operators can drop extra
# lang/<code>.yml files in plugins/SafeRTP/lang/.
language: en

config-version: 2

# World used by a plain /rtp when the player stands in a world where RTP is
# disabled (a spawn or lobby world). Empty = no fallback.
default-world: ""

# ============================================================
# DESTINATION MENU  (v1.5.0)
# ============================================================
# /rtp without a world opens a menu with one button per enabled world
# (worlds.yml) the player may use, with its distance, cost and wait.
# /rtp <world> still goes straight there. false = /rtp works as before 1.5.0.
menu:
  enabled: true
  rows: 3
  # Window title (MiniMessage). Empty = menu-title from the lang file. A
  # resource-pack glyph or <lang_or:...> here draws the background and the
  # glass frame is left out.
  title: ""
  # Slot of each world's button (0 = top left). A world not listed takes a
  # free slot in the middle row.
  slots:
    world: 11
    world_nether: 13
    world_the_end: 15
  icons:
    world: GRASS_BLOCK
    world_nether: NETHERRACK
    world_the_end: END_STONE
  # Optional item_model per world (1.21.4+ with a resource pack), e.g.
  #   world: "mypack:menu/rtp_overworld". Older clients see the icon above.
  models: {}
  # Extra lore lines per world (MiniMessage), e.g. a warning:
  #   world_the_end: "<red>Dangerous: endermen and the void. Bring gear."
  notes: {}

# ============================================================
# BACK COMMAND  (v1.1.0)
# ============================================================
# Lets players undo their last /rtp with /rtp back.
# The pre-teleport location is cached in memory (not in the database)
# and expires after ttl-seconds. Handy when the RTP drops someone in
# an awkward biome and they just want to go back.
back:
  enabled: true
  ttl-seconds: 300
  cooldown-seconds: 60

# ============================================================
# ARRIVAL EFFECTS  (v1.2.0)
# ============================================================
# Applied immediately after a successful RTP teleport.
arrival:
  # Seconds of invulnerability (no-damage ticks) on landing. 0 = disabled.
  invulnerability-seconds: 5
  particles:
    enabled: true
    # Any particle name, old or new (END_ROD, HAPPY_VILLAGER / VILLAGER_HAPPY...).
    type: END_ROD
    count: 40
  sound:
    enabled: true
    # A sound key (entity.enderman.teleport) or its constant name.
    type: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.2

# ============================================================
# LOCATION CACHE  (v1.2.0)
# ============================================================
# Pre-calculates safe RTP locations in background so /rtp is instant.
cache:
  enabled: true
  size-per-world: 6
  refill-threshold: 2

# ============================================================
# BIOME DISCOVERY  (v1.2.0)
# ============================================================
# Special notification the first time a player RTP-lands in a new biome.
# Discoveries persist across restarts in discoveries.yml.
discovery:
  enabled: true
  sound:
    enabled: true
    type: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
